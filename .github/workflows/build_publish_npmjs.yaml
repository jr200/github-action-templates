name: template-build-publish-npmjs

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: "checkout ref"
        required: false
        type: string
        default: "refs/heads/master"
      pnpm-run-test:
        description: "pnpm run test:run"
        required: false
        type: string
        default: 'true'
      pnpm-publish-args:
        description: "pnpm publish args"
        required: false
        type: string
        default: ~
      preview-id:
        description: "Publish an immutable prerelease using this identifier (for example, a PR number)"
        required: false
        type: string
        default: ''
      node-version:
        description: "Node.js version; defaults to .node-version, then 22"
        required: false
        type: string
        default: ''
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: ''
      preserve-pnpm-workspace:
        description: 'Keep pnpm-workspace.yaml while installing and building a monorepo'
        required: false
        type: boolean
        default: true
    secrets:
      npmjs_api_token:
        required: true

jobs:
  main:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Resolve Node.js version
        id: node-version
        env:
          INPUT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          version="$INPUT_NODE_VERSION"
          if [ -z "$version" ] && [ -f .node-version ]; then
            version="$(head -n 1 .node-version)"
          fi
          echo "version=${version:-22}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}

      - name: Set immutable preview version
        if: inputs.preview-id != ''
        env:
          PREVIEW_ID: ${{ inputs.preview-id }}
        run: |
          if ! [[ "$PREVIEW_ID" =~ ^[0-9A-Za-z-]+$ ]]; then
            echo "::error::preview-id may contain only letters, numbers, and hyphens"
            exit 1
          fi
          BASE_VERSION=$(node -p "require('./package.json').version.split('-')[0]")
          PREVIEW_VERSION="${BASE_VERSION}-pr.${PREVIEW_ID}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          npm version "$PREVIEW_VERSION" --no-git-tag-version
          echo "Publishing preview version: $PREVIEW_VERSION"
          echo "### npm preview: \`$PREVIEW_VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Install pnpm
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager?.replace(/^pnpm@/, '') || '11'")"
          npm install --global "pnpm@$PNPM_VERSION"

      - name: Use clean pnpm-workspace config for CI (avoid locally stored packages used in dev)
        if: inputs.preserve-pnpm-workspace == false
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            mv pnpm-workspace.yaml pnpm-workspace.local.yaml
          fi

      - run: pnpm install --no-frozen-lockfile
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

      - name: Sync shared lint config
        run: |
          mkdir -p .shared
          curl -sfL "https://raw.githubusercontent.com/jr200-labs/github-action-templates/master/shared/eslint.config.mjs" \
            -o .shared/eslint.config.mjs

      - run: pnpm run lint
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

      - name: run tests (optionally configured)
        if: inputs.pnpm-run-test == 'true'
        run: pnpm run test:run
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

      - run: pnpm run build
        env:
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

      - name: Restore pnpm-workspace config
        if: inputs.preserve-pnpm-workspace == false
        run: |
          if [ -f pnpm-workspace.local.yaml ]; then
            mv pnpm-workspace.local.yaml pnpm-workspace.yaml
          fi

      - name: Configure npm for pnpm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npmjs_api_token }}
        run: |
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          } > .npmrc
          cp .npmrc ~/.npmrc

      - name: Pre-publish diagnostics
        continue-on-error: true
        run: |
          set +e

          echo "--- npm auth check ---"
          NPM_USER=$(npm whoami 2>&1)
          if [ $? -ne 0 ]; then
            echo "::warning::npm whoami failed: $NPM_USER"
            echo "::warning::The NPMJS_API_TOKEN may be invalid, expired, or missing."
          else
            echo "Authenticated as: $NPM_USER"
          fi

          PACKAGE_NAME=$(node -p "require('./package.json').name" 2>/dev/null || echo "unknown")
          echo "Package: $PACKAGE_NAME"

          SCOPE=$(echo "$PACKAGE_NAME" | grep -oP '^@\K[^/]+' || true)
          if [ -n "$SCOPE" ]; then
            echo ""
            echo "--- npm org membership check (@$SCOPE) ---"
            ORG_MEMBERS=$(npm org ls "$SCOPE" 2>&1)
            echo "$ORG_MEMBERS"
            if echo "$ORG_MEMBERS" | grep -q "$NPM_USER"; then
              echo "User '$NPM_USER' found in @$SCOPE org"
            else
              echo "::warning::User '$NPM_USER' not found in @$SCOPE org member list."
              echo "::warning::Verify at: https://www.npmjs.com/settings/$SCOPE/members"
            fi
          fi

          echo ""
          echo "--- package existence check ---"
          LATEST=$(npm view "$PACKAGE_NAME" version 2>&1)
          if [ $? -eq 0 ]; then
            echo "Package exists on registry (latest: $LATEST)"
          else
            echo "Package does not yet exist on registry (first publish)"
          fi

          echo ""
          echo "--- environment info ---"
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "pnpm: $(pnpm --version)"

      - name: build publish command
        id: build-command
        env:
          PREVIEW_ID: ${{ inputs.preview-id }}
        run: |
          BASE_CMD="pnpm publish --access public"

          if [ -n "$PREVIEW_ID" ]; then
            BASE_CMD="$BASE_CMD --tag preview"
          fi
          
          if [ "${{ inputs.pnpm-publish-args }}" != "null" ] && [ "${{ inputs.pnpm-publish-args }}" != "" ]; then
            PUBLISH_CMD="$BASE_CMD ${{ inputs.pnpm-publish-args }}"
          else
            PUBLISH_CMD="$BASE_CMD"
          fi
          
          echo "Generated command: $PUBLISH_CMD"
          echo "publish_command=$PUBLISH_CMD" >> $GITHUB_OUTPUT

      - name: publish to npmjs
        run: ${{ steps.build-command.outputs.publish_command }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npmjs_api_token }}
          NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
