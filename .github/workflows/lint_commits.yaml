name: template-lint-commits

# Reusable workflow that validates all commits in a pull request and the
# PR title against the Conventional Commits spec using Cocogitto. The PR
# title matters because org policy is squash-only, and GitHub uses the PR
# title as the squash commit subject.

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (e.g. ubuntu-latest or self-hosted)'
        required: false
        type: string
        default: ''
      fail-on-warnings:
        description: 'Deprecated; retained for caller compatibility'
        required: false
        type: boolean
        default: false
      config-file:
        description: 'Deprecated; retained for caller compatibility'
        required: false
        type: string
        default: ''

jobs:
  commitlint:
    runs-on: ${{ inputs.runner || fromJSON(vars.RUNNER_PROFILES)[vars.RUNNER_PROFILE].default }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install Cocogitto
        uses: cocogitto/cocogitto-action@v4
        with:
          install-only: true

      - name: Verify PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          title_file="$(mktemp)"
          printf '%s\n' "${PR_TITLE}" > "${title_file}"
          cog verify --file "${title_file}"
          rm -f "${title_file}"

      - name: Check commits
        shell: bash
        run: cog check
