name: publish-oci-artifact

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: checkout ref
        required: false
        type: string
        default: refs/heads/master

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  configure:
    uses: jr200-labs/github-action-templates/.github/workflows/preconfigure.yaml@master
    with:
      event_name: ${{ toJson(github.event_name) }}
      event: ${{ toJson(github.event) }}

  publish:
    needs: configure
    uses: jr200-labs/github-action-templates/.github/workflows/publish_oci_artifact.yaml@master
    with:
      checkout-ref: ${{ fromJson(needs.configure.outputs.context).checkout-ref }}
